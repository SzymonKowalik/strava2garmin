[project]
name = "strava2garmin"
version = "0.1.0"
description = "Sync Strava rides to Garmin Connect with Garmin device info"
requires-python = ">=3.11"
dependencies = [
    "fit-tool>=0.9.15",
    "garth==0.6.3",
    "python-dotenv>=1.2.2",
    "stravalib>=2.4",
]

[tool.uv]
# app/ is run as scripts, not installed as a package
package = false
